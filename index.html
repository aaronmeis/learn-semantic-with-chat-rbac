<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning to Build Enterprise Agents with RBAC</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Learning to Build Enterprise Agents with RBAC</h1>
        
        <div class="welcome-message">
            <p>Welcome! This is a learning project designed to demonstrate and showcase how to build enterprise-grade AI agents with Role-Based Access Control (RBAC). Explore the slides below to see the concepts, architecture, and implementation details.</p>
        </div>
        
        <div class="tab-content">
            <!-- Slides -->
            <div id="slides-tab" class="tab-pane active">
                <div class="slides-container">
                    <div class="slide-controls">
                        <button id="prev-slide" class="slide-btn">Previous</button>
                        <span id="slide-counter">1 / 1</span>
                        <button id="next-slide" class="slide-btn">Next</button>
                        <button id="toggle-autoplay" class="slide-btn autoplay-btn">Pause</button>
                    </div>
                    <img id="slide-image" alt="Slide" style="display: none;">
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
